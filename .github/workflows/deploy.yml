name: CI/CD

# Tests sur chaque push + PR. Build & déploiement seulement sur push vert vers main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kelysaina/kontera

jobs:
  # ---------------------------------------------------------------------------
  # 1. Tests — le garde-fou. Rien ne se build ni ne se déploie si ça casse.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # ---------------------------------------------------------------------------
  # 2. Build une image Docker et push :<sha> + :latest sur GHCR.
  # ---------------------------------------------------------------------------
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN peut pousser sur GHCR, pas besoin de PAT
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. Déploiement — SSH vers le VPS, pull de l'image, (re)lancement.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/kontera
            export GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}'
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" fetch --all --prune
            git checkout --force '${{ github.sha }}'
            export IMAGE_TAG='${{ github.sha }}'
            export GHCR_USER='${{ github.repository_owner }}'
            export GHCR_TOKEN='${{ secrets.GHCR_PAT }}'
            bash scripts/deploy.sh
